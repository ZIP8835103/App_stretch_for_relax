.bar{height:12px;background:var(--mint);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--deep)}
.stepbar{display:flex;gap:4px;margin-bottom:14px}.stepbar div{flex:1;height:10px;border-radius:99px;background:var(--mint)}.stepbar .on{background:var(--deep)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}.poseFig img{max-height:58vh;object-fit:contain;background:#f3fbf8}.timer.rest{font-size:48px}.phase{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:14px;padding:4px 12px;font-weight:600}
.poseFig{text-align:center}.poseFig img{width:100%;border-radius:16px;border:2px solid var(--mint)}
.camBox{position:relative;border-radius:22px;overflow:hidden;background:#123;aspect-ratio:4/3;width:100%}.camBox video{width:100%;height:100%;object-fit:cover}.mirror{transform:scaleX(-1)}
.badge.restb{background:rgba(42,157,143,.95)}.badge{position:absolute;top:12px;left:12px;background:rgba(231,111,111,.95);color:#fff;border-radius:999px;padding:6px 14px;font-weight:600}
.timer{position:absolute;right:14px;bottom:10px;font-size:64px;font-weight:600;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
video.rev{width:100%;border-radius:16px;background:#000;margin-top:6px}
.alink{text-align:center;margin-top:10px}.alink a{color:var(--deep);cursor:pointer;text-decoration:underline}
button.chip{width:auto;font-size:14px;padding:6px 14px;margin:0;background:#fff;color:var(--deep);border:2px solid var(--mint3);box-shadow:none;white-space:nowrap;flex:none}
button.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.pgrid>*{min-width:0}.chips{max-width:100%;-webkit-overflow-scrolling:touch;display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;text-align:center}.stat div{background:var(--mint2);border-radius:16px;padding:10px 4px}.stat b{display:block;font-size:24px}

main{padding-top:max(14px,env(safe-area-inset-top));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
h1{font-size:25px}h2{font-size:19px}.card{padding:16px 14px;border-radius:22px}

.phase{left:6px;right:6px;bottom:6px;font-size:12px;text-align:center;border-radius:10px;padding:3px 6px;line-height:1.3}
button.sm{font-size:14px;padding:8px 12px;flex:1}.menu{gap:8px}.tile{padding:14px 6px}
.stat b{font-size:20px}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

cause:`<h1>สาเหตุของอาการปวดคอ</h1>
<div class="card"><h2>กายวิภาคศาสตร์</h2><p>กระดูกสันหลังคอ 7 ชิ้น (C1–C7) รองรับศีรษะที่หนักราว 4.5–5 กก. มีหมอนรองกระดูก ข้อต่อ เอ็นยึด และกล้ามเนื้อหลายชั้น เช่น upper trapezius, levator scapulae, sternocleidomastoid และกลุ่ม deep neck flexors ที่ช่วยพยุงคอ</p></div>

tools:`<h1>แบบประเมิน NDI และ NRS</h1>
<div class="card"><h2>NDI (Neck Disability Index)</h2><p>แบบสอบถาม 10 ข้อ (ความปวด การดูแลตนเอง การยก การอ่าน ปวดศีรษะ สมาธิ การทำงาน การขับรถ การนอน การพักผ่อน) ข้อละ 0–5 คะแนน รวม 50 คะแนน (คูณ 2 เป็นร้อยละ)</p>

<li>Cleland JA, Childs JD, Whitman JM. Psychometric properties of the Neck Disability Index and Numeric Pain Rating Scale in patients with mechanical neck pain. Arch Phys Med Rehabil. 2008;89(1):69-74.</li></ol></div>`,
physio:`<h1>คำแนะนำทางกายภาพบำบัด</h1>
<div class="card"><ul><li>ยืดเหยียดและออกกำลังกายกล้ามเนื้อคอ-บ่า-สะบักเป็นประจำ มีหลักฐานว่าลดปวดคอเรื้อรังได้</li><li>ปรับท่าทาง: ยกหน้าจอให้อยู่ระดับสายตา หลีกเลี่ยงการก้มคอนาน</li><li>ลุกขยับทุก 30–60 นาที</li><li>ประคบอุ่นบริเวณคอ-บ่าที่เกร็ง</li><li>หยุดและพบแพทย์หากชา อ่อนแรง ปวดร้าวลงแขน ปวดรุนแรงหลังอุบัติเหตุ หรือปวดนานเกิน 2–4 สัปดาห์</li></ul></div>
<div class="card"><h2>งานวิจัยรองรับ</h2><ol class="mut"><li>Blanpied PR, et al. Neck Pain: Revision 2017. J Orthop Sports Phys Ther. 2017;47(7):A1-A83.</li>
<li>Gross A, et al. Exercises for mechanical neck disorders. Cochrane Database Syst Rev. 2015;(1):CD004250.</li></ol></div>
<p class="mut">ข้อมูลนี้เพื่อการศึกษา ไม่ใช่การวินิจฉัยโรค</p>`};
function page(k){shell(`<div class='card'>${PAGES[k]}</div>`,1)}

// ---------- Activity ----------
function activity(){shell(`<div class="card"><h2 class="center">🧘 กิจกรรมคลายปวดคอ 12 ท่า</h2>
<p class="hint center">ระบบจะเปิดกล้องและบันทึกวิดีโอขณะทำกิจกรรม เฉพาะผู้ดูแลระบบเท่านั้นที่ดูได้</p>
${POSES.map((p,i)=>`<div class="ben"><b>ท่าที่ ${i+1} ${p[0]}</b>ประยุกต์จาก${p[1]}<br>ช่วยยืดกล้ามเนื้อ${p[2]}</div>`).join('')}
<button onclick="startAct()">▶ เริ่มทำกิจกรรม</button></div>`,1)}
const stopCam=()=>{relWake();clearInterval(tm);try{rec&&rec.state!='inactive'&&rec.stop()}catch(e){}stream?.getTracks().forEach(t=>t.stop());stream=rec=null};
let tm,mir=true,flt=0,paused=false;
const FILTERS=[['ปกติ',''],['สดใส','brightness(1.08) contrast(1.08) saturate(1.35)'],['ผิวเนียน','brightness(1.12) contrast(.92) saturate(1.1) blur(.6px)'],['อบอุ่น','sepia(.25) saturate(1.3) brightness(1.06) hue-rotate(-8deg)'],['วินเทจ','sepia(.55) contrast(.95) brightness(1.04)'],['ขาวดำ','grayscale(1) contrast(1.1)']];
function applyCam(){const v=$('#cam');if(!v)return;v.style.filter=FILTERS[flt][1];v.classList.toggle('mirror',mir)}
function setFlt(k){flt=k;applyCam();document.querySelectorAll('.chip').forEach((c,j)=>c.classList.toggle('on',j==k))}
const camTools=()=>`<div class="chips">${FILTERS.map((f,j)=>`<button class="chip ${j==flt?'on':''}" onclick="setFlt(${j})">${f[0]}</button>`).join('')}</div>
<div class="row" style="margin-top:6px"><button class="alt sm" onclick="mir=!mir;applyCam()">↔ กลับด้านภาพ</button><button class="alt sm" onclick="beep()">🔔 ทดสอบเสียง</button></div>`;
let wl=null;
async function keepAwake(){try{if('wakeLock' in navigator)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function relWake(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(rec&&rec.state=='recording'&&!paused)togglePause()}else if(stream)keepAwake()});
function togglePause(){paused=!paused;try{paused?rec.pause():rec.resume()}catch(e){}
 const b=$('#pz');if(b)b.textContent=paused?'▶ ทำต่อ':'⏸ หยุดชั่วคราว'}
async function startAct(){
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})}
 catch(e){return alert(/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent)?'เบราว์เซอร์ในแอปนี้เปิดกล้องไม่ได้ กรุณากดเมนู "เปิดในเบราว์เซอร์" แล้วใช้ Safari หรือ Chrome':'เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง (ต้องเปิดผ่าน https) แล้วลองใหม่')}
 shell(`<div class="card"><h2 class="center">ปรับกล้องให้พร้อม แล้วกดเริ่ม</h2>
<p class="hint center">เลือกฟิลเตอร์และมุมกล้องได้ตามสบาย ระบบจะเริ่มบันทึกและจับเวลาเมื่อคุณกดปุ่มเริ่มเท่านั้น</p>
<div class="pgrid"><div class="poseFig"><img src="${IMG(0,0)}" alt="ท่า${POSES[0][0]}"><p class="mut" style="margin:6px 0 0">ท่าแรก: ${POSES[0][0]}</p></div>
<div><div class="camBox"><video id="cam" playsinline muted autoplay></video></div></div></div>${camTools()}
<button style="margin-top:14px" onclick="beginAct()">▶ เริ่มท่าที่ 1</button></div>`,1);
 $('#cam').srcObject=stream;applyCam();keepAwake()}
function beginAct(){
 const mt=['video/webm;codecs=vp8','video/webm','video/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
 chunks=[];rec=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:600000}:{});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.start(1000);
 step(0,Date.now(),rec.mimeType||mt||'video/webm')}
let AC=null;
function beep(n=1,f=880){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();
 for(let k=0;k<n;k++){const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+k*.3;o.frequency.value=f;o.connect(g);g.connect(AC.destination);
 g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.4,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.25);o.start(s);o.stop(s+.26)}}catch(e){}}
function step(i,t0,mime){clearInterval(tm);if(paused){paused=false;try{rec.resume()}catch(e){}}
 if(i>=POSES.length)return finish(t0,mime);const p=POSES[i];let s=HOLD_SEC,ph='hold';const SIDES=SIDE_LBL[i];let si=0;SIDES.forEach((_,k)=>{new Image().src=IMG(i,k)});if(POSES[i+1])new Image().src=IMG(i+1,0);
 shell(`<div class="card"><div class="stepbar">${POSES.map((_,j)=>`<div class="${j<=i?'on':''}"></div>`).join('')}</div>
<h2 id="pt">ท่าที่ ${i+1}/12: ${p[0]}</h2>
<div class="pgrid"><div class="poseFig"><img id="pimg" src="${IMG(i,0)}" alt="ท่า${p[0]}"></div>
<div><div class="camBox"><video id="cam" playsinline muted autoplay class="${mir?'mirror':''}"></video><div class="badge" id="bd">● กำลังบันทึก</div><div class="timer" id="cd">${s}</div><div class="phase" id="ph">${SIDES[0]}</div></div></div></div>
${camTools()}
<div class="ben" style="margin-top:12px" id="inf"><b>💚 ประโยชน์</b>ประยุกต์จาก${p[1]} ช่วยยืดกล้ามเนื้อ${p[2]}</div>
<button class="alt" id="pz" onclick="togglePause()">⏸ หยุดชั่วคราว</button><button onclick="step(${i+1},${t0},'${mime}')">${i<11?'ข้ามไปท่าถัดไป ➜':'เสร็จสิ้น ✓'}</button></div>`);
 $('#cam').srcObject=stream;applyCam();
 tm=setInterval(()=>{if(paused)return;s--;
  if(s<=0){
   if(ph=='hold'&&si<SIDES.length-1){si++;s=HOLD_SEC;beep(2);$('#ph').textContent='สลับ → '+SIDES[si];$('#pimg').src=IMG(i,si);$('#cd').textContent=s;return}
   if(ph=='hold'){beep(2);if(i>=POSES.length-1){clearInterval(tm);return finish(t0,mime)}
    ph='rest';s=REST_SEC;const n=POSES[i+1];
    $('#bd').textContent='😌 พัก';$('#bd').classList.add('restb');$('#cd').classList.add('rest');$('#ph').textContent='พัก • ท่าถัดไป: '+n[0];
    $('#pimg').src=IMG(i+1,0);$('#pt').textContent=`พัก ${REST_SEC} วินาที → ท่าที่ ${i+2}: ${n[0]}`;
   }else{beep(3,1040);return step(i+1,t0,mime)}
  }
  $('#cd').textContent=s},1000)}
async function finish(t0,mime){relWake();clearInterval(tm);shell('<div class="card center"><h2>กำลังบันทึกข้อมูล...</h2><p class="hint">อย่าปิดหน้านี้</p></div>');
 await new Promise(r=>{rec.onstop=r;rec.stop()});stream.getTracks().forEach(t=>t.stop());
 const ext=mime.includes('mp4')?'mp4':'webm',path=`${user.id}/${Date.now()}.${ext}`;
 const up=await sb.storage.from('videos').upload(path,new Blob(chunks,{type:mime}),{contentType:mime});
 const ins=await sb.from('activity_logs').insert({user_id:user.id,started_at:new Date(t0).toISOString(),duration_sec:Math.round((Date.now()-t0)/1000),video_path:up.error?null:path});
 if(up.error||ins.error)return shell(`<div class="card center"><p class="err">บันทึกไม่สำเร็จ: ${esc((up.error||ins.error).message)}</p><button onclick="home()">กลับหน้าหลัก</button></div>`);
 shell(`<div class="card center"><div style="font-size:70px">🎉</div><h2>ทำกิจกรรมเสร็จสิ้น</h2><p>ใช้เวลา ${Math.max(1,Math.round((Date.now()-t0)/60000))} นาที</p><p class="hint">อย่าลืมทำให้ครบ ${GOAL} ครั้งใน ${DAYS} วัน</p><button onclick="home()">กลับหน้าหลัก</button></div>`)}

// ---------- Admin ----------
let adm={users:[],logs:[],uid:'',q:''};
const fmtDur=d=>Math.floor((d||0)/60)+' นาที '+((d||0)%60)+' วินาที';
async function admin(){shell('<div class="card center">กำลังโหลด...</div>',1);
 const[u,l]=await Promise.all([sb.from('profiles').select('id,full_name,email,role').order('full_name'),
  sb.from('activity_logs').select('id,user_id,started_at,duration_sec,video_path').order('started_at',{ascending:false}).limit(500)]);
 if(u.error||l.error)return shell(`<div class="card"><p class="err">${esc((u.error||l.error).message)}</p><p class="mut">ตรวจสอบว่ารัน setup.sql แล้ว และบัญชีนี้ถูกตั้งเป็น admin</p></div>`,1);
 adm={users:u.data,logs:l.data,uid:'',q:''};adminView()}
function userList(){const per={};adm.logs.forEach(r=>{const o=per[r.user_id]||(per[r.user_id]={n:0,last:r.started_at});o.n++});
 const q=adm.q.toLowerCase();
 return adm.users.filter(x=>!q||(x.full_name||'').toLowerCase().includes(q)||(x.email||'').toLowerCase().includes(q)).map(x=>{const o=per[x.id];
  return `<div class="day ${adm.uid==x.id?'today':''}"><b>${esc(x.full_name||'-')}<br><span class="mut">${esc(x.email||'')}</span></b><span class="slot ${o?'done':''}">${o?o.n+' ครั้ง · ล่าสุด '+new Date(o.last).toLocaleDateString('th-TH'):'ยังไม่เคยทำ'}</span><button class="sm" onclick="adm.uid='${x.id}';adminView()">ดูวิดีโอ</button></div>`}).join('')||'<p class="mut">ไม่พบผู้ใช้</p>'}
function adminView(){
 const nm=Object.fromEntries(adm.users.map(x=>[x.id,x])),today=adm.logs.filter(r=>dkey(r.started_at)==dkey(new Date())).length,
  vids=adm.logs.filter(r=>r.video_path&&(!adm.uid||r.user_id==adm.uid));
 shell(`<div class="card"><h2>ผู้ดูแลระบบ</h2>
<div class="stat"><div><b>${adm.users.length}</b>ผู้ใช้</div><div><b>${adm.logs.length}</b>ครั้งทั้งหมด</div><div><b>${today}</b>วันนี้</div></div>
<input placeholder="ค้นหาชื่อหรืออีเมล" oninput="adm.q=this.value;$('#ul').innerHTML=userList()"><div id="ul">${userList()}</div>
<button class="alt sm" onclick="admin()">🔄 รีเฟรชข้อมูล</button></div>
<div class="card"><h2>วิดีโอ ${adm.uid?esc(nm[adm.uid]?.full_name||''):'ทั้งหมด (ล่าสุด)'}</h2>${adm.uid?'<button class="alt sm" onclick="adm.uid=\'\';adminView()">แสดงทุกคน</button>':''}
${vids.map(r=>`<div class="ben"><b>${esc(nm[r.user_id]?.full_name||'-')} <span class="mut">${esc(nm[r.user_id]?.email||'')}</span></b><span class="mut">${new Date(r.started_at).toLocaleString('th-TH')} · ${fmtDur(r.duration_sec)}</span>
<div class="row"><button class="sm" onclick="playVid('${r.id}')">▶ เปิดวิดีโอ</button><button class="alt sm" onclick="dlVid('${r.id}')">⬇ ดาวน์โหลด</button></div><div id="v${r.id}"></div></div>`).join('')||'<p class="mut">ยังไม่มีวิดีโอ</p>'}</div>`,1)}
async function signed(id,dl){const r=adm.logs.find(x=>String(x.id)==String(id));
 const{data,error}=await sb.storage.from('videos').createSignedUrl(r.video_path,3600,dl?{download:true}:undefined);
 if(error){alert('เปิดไฟล์ไม่ได้: '+error.message);return null}return data.signedUrl}
async function playVid(id){const u=await signed(id);if(u)$('#v'+id).innerHTML=`<video class="rev" controls playsinline autoplay src="${u}"></video>`}
async function dlVid(id){const u=await signed(id,true);if(u)location.href=u}

sb.auth.onAuthStateChange(()=>{});boot();
</script></body></html>
